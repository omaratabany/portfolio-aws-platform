name: CI

on:
  pull_request:
    branches:
      - main

# Neither job writes anything back to the repo or needs a credential that
# outlives the checkout — this is the same least-privilege lens as
# reports/02-least-privilege.md, applied to the GITHUB_TOKEN itself, not
# just AWS IAM. contents: read is the ceiling; persist-credentials: false
# on each checkout means no token is even left on disk for the rest of
# the job to pick up — important specifically because "Run tests" and
# "Run Checkov" both execute code/config from the PR branch itself.
permissions:
  contents: read

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest boto3

      - name: Run tests
        run: pytest tests/ -v

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform init (no backend)
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: terraform

  security-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # soft_fail: true deliberately, for now — see reports/03-cicd-hardening.md
      # (ADR-14). This is the first time this scanner has ever run against
      # already-deployed infrastructure; day-one hard-enforcement would
      # block every future PR on findings nobody has triaged yet.
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true
